name: Release

# Publishes a GitHub release whenever main has a manifest.json version that
# has no release yet, so HACS always sees new versions. A release written by
# hand beforehand (with better notes) is left alone.
on:
  push:
    branches: [main]
    paths: [custom_components/thermann/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: version
        run: echo "tag=v$(jq -r .version custom_components/thermann/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create the release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"
            exit 0
          fi
          # Home Assistant shows "<version> - <release title>", so the title
          # describes the change instead of repeating the version: the
          # commit subject, without a trailing "(x.y.z)".
          TITLE="$(git log -1 --format=%s "$GITHUB_SHA" | sed -E 's/ *\(v?[0-9]+(\.[0-9]+)*\)$//')"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "${TITLE:-${TAG#v}}" --generate-notes
