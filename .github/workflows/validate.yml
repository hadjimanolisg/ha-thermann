name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly, catches breaking HA releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: needs a PR to home-assistant/brands; license is the
          # original authors' call (none upstream).
          ignore: brands license

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported HA line, pinned in requirements_test.txt
          - name: pinned
            python: "3.13"
            install: -r requirements_test.txt
          # Newest HA the test harness ships; catches upcoming breakages
          - name: latest
            python: "3.14"
            install: pytest-homeassistant-custom-component
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.install }}
      - run: pytest -q
